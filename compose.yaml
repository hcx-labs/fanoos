# The whole Fanoos stack from the published images.
#   cp compose.env.example .env   # fill it in
#   docker compose up -d          # then open PUBLIC_URL
# Only core is published; backends, the streaming companion and Redis stay on the internal network.
name: fanoos

x-backend: &backend
  restart: unless-stopped
  environment: &backend-env
    BACKEND_TOKEN: ${BACKEND_TOKEN:?set BACKEND_TOKEN in .env}
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
    REDIS_URL: redis://redis:6379
  depends_on: [redis]

services:
  core:
    image: ghcr.io/hcx-labs/fanoos-core:${FANOOS_VERSION:-latest}
    restart: unless-stopped
    ports: ["${FANOOS_PORT:-8787}:8787"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      BACKEND_TOKEN: ${BACKEND_TOKEN:?set BACKEND_TOKEN in .env}
      BACKENDS: youtube=http://youtube:8788,crunchyroll=http://crunchyroll:8789
      SECRET_KEY: ${CORE_SECRET_KEY:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-}
    volumes: [core-data:/data]
    depends_on: [youtube, crunchyroll]

  youtube:
    <<: *backend
    image: ghcr.io/hcx-labs/fanoos-youtube:${FANOOS_VERSION:-latest}
    environment:
      <<: *backend-env
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # Optional: send this backend's own YouTube requests (video pages, search, channels) through a
      # proxy too, e.g. YOUTUBE_PROXY=http://warp:1080, when YouTube serves this server stripped-down
      # pages (no view counts or descriptions). Node 24 picks these up; the companions stay direct.
      NODE_USE_ENV_PROXY: ${YOUTUBE_PROXY:+1}
      HTTPS_PROXY: ${YOUTUBE_PROXY:-}
      HTTP_PROXY: ${YOUTUBE_PROXY:-}
      NO_PROXY: companion,companion-signed-in,redis,localhost,127.0.0.1
      COMPANION_URL: http://companion:8282
      # Optional signed-in instance for age-restricted videos (profile "age-restricted" below).
      COMPANION_SIGNED_IN_URL: http://companion-signed-in:8282
      COMPANION_SECRET: ${COMPANION_SECRET:?set COMPANION_SECRET (16 characters) in .env}
    volumes: [youtube-data:/data]
    depends_on: [redis, companion]

  crunchyroll:
    <<: *backend
    image: ghcr.io/hcx-labs/fanoos-crunchyroll:${FANOOS_VERSION:-latest}
    environment:
      <<: *backend-env
      CRUNCHYROLL_BASIC_AUTH: ${CRUNCHYROLL_BASIC_AUTH:-}
      CRUNCHYROLL_APP_VERSION: ${CRUNCHYROLL_APP_VERSION:-}
    volumes: [crunchyroll-data:/data]

  # Generates YouTube's anti-bot tokens and streams media for the YouTube backend.
  companion:
    image: quay.io/invidious/invidious-companion:latest
    restart: unless-stopped
    environment:
      SERVER_SECRET_KEY: ${COMPANION_SECRET:?set COMPANION_SECRET (16 characters) in .env}
      HOST: 0.0.0.0
      PORT: "8282"
      # Send YouTube traffic through a proxy, e.g. the warp service below: socks5://warp:1080
      PROXY: ${COMPANION_PROXY:-}
    # If YouTube refuses this server's address (common on VPS IPs: `docker compose logs companion`
    # shows "Failed to validate PO token"), resolve YouTube through a DNS-based proxy instead:
    # dns: [203.0.113.1, 203.0.113.2]
    # Most DNS proxies only rewrite IPv4; switch IPv6 off so nothing goes around them:
    # sysctls:
    #   net.ipv6.conf.all.disable_ipv6: 1
    #   net.ipv6.conf.default.disable_ipv6: 1

  # Optional: a signed-in companion, used only for age-restricted videos. Start it with
  #   docker compose --profile age-restricted up -d companion-signed-in
  # and enter the code from its log (docker compose logs -f companion-signed-in) at google.com/device.
  # Use a secondary Google account. The sign-in is kept in the companion-signed-in volume.
  companion-signed-in:
    image: quay.io/invidious/invidious-companion:latest
    profiles: [age-restricted]
    restart: unless-stopped
    environment:
      SERVER_SECRET_KEY: ${COMPANION_SECRET:?set COMPANION_SECRET (16 characters) in .env}
      HOST: 0.0.0.0
      PORT: "8282"
      YOUTUBE_SESSION_OAUTH_ENABLED: "true"
      CACHE_DIRECTORY: /cache
      PROXY: ${COMPANION_PROXY:-}
    volumes: [companion-signed-in:/cache]
    # Same DNS-based proxy as the companion, if you use one:
    # dns: [203.0.113.1, 203.0.113.2]
    # sysctls:
    #   net.ipv6.conf.all.disable_ipv6: 1
    #   net.ipv6.conf.default.disable_ipv6: 1

  # Optional: Cloudflare WARP as a proxy, for servers whose address YouTube refuses (companion log:
  # "Failed to validate PO token"). Start it and point the companions at it:
  #   COMPANION_PROXY=socks5://warp:1080   (in .env)
  #   docker compose --profile warp up -d
  # Only reachable inside this network. See https://blog.caomingjun.com/run-cloudflare-warp-in-docker/en/
  warp:
    image: caomingjun/warp:latest
    profiles: [warp]
    restart: unless-stopped
    environment:
      WARP_SLEEP: "2"
      # Optional WARP+ licence key; without one a free WARP account is registered on first start.
      WARP_LICENSE_KEY: ${WARP_LICENSE_KEY:-}
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv4.conf.all.src_valid_mark: 1
    volumes: [warp-data:/var/lib/cloudflare-warp]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]

volumes:
  warp-data:
  companion-signed-in:
  core-data:
  youtube-data:
  crunchyroll-data:
