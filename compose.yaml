# The whole Fanoos stack from the published images.
#   cp compose.env.example .env   # fill it in
#   docker compose up -d          # then open PUBLIC_URL
# Only core is published; backends, the streaming companion and Redis stay on the internal network.
# Resolving through Control D (ctrld) instead: see compose.ctrld.yaml.
name: fanoos

x-backend: &backend
  restart: unless-stopped
  environment: &backend-env
    BACKEND_TOKEN: ${BACKEND_TOKEN:?set BACKEND_TOKEN in .env}
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
    REDIS_URL: redis://redis:6379
  depends_on: [redis]

services:
  core:
    image: ghcr.io/hcx-labs/fanoos-core:${FANOOS_VERSION:-latest}
    restart: unless-stopped
    ports: ["${FANOOS_PORT:-8787}:8787"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      BACKEND_TOKEN: ${BACKEND_TOKEN:?set BACKEND_TOKEN in .env}
      BACKENDS: youtube=http://youtube:8788,crunchyroll=http://crunchyroll:8789,plex=http://plex:8790
      SECRET_KEY: ${CORE_SECRET_KEY:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-}
    volumes: [core-data:/data]
    depends_on: [youtube, crunchyroll, plex]

  youtube:
    <<: *backend
    image: ghcr.io/hcx-labs/fanoos-youtube:${FANOOS_VERSION:-latest}
    environment:
      <<: *backend-env
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # Optional: send this backend's own YouTube requests (video pages, search, channels) through an
      # HTTP proxy, when YouTube serves this server stripped-down pages (no view counts or
      # descriptions). Node 24 picks these up; the companions use COMPANION_PROXY.
      NODE_USE_ENV_PROXY: ${YOUTUBE_PROXY:+1}
      HTTPS_PROXY: ${YOUTUBE_PROXY:-}
      HTTP_PROXY: ${YOUTUBE_PROXY:-}
      NO_PROXY: companion,companion-signed-in,redis,localhost,127.0.0.1
      COMPANION_URL: http://companion:8282
      # Optional signed-in instance for age-restricted videos (profile "age-restricted" below).
      COMPANION_SIGNED_IN_URL: http://companion-signed-in:8282
      # Its volume, read-only: where it leaves the google.com/device code that Settings shows.
      COMPANION_SIGNED_IN_DIR: /companion-signed-in
      COMPANION_SECRET: ${COMPANION_SECRET:?set COMPANION_SECRET (16 characters) in .env}
    volumes: [youtube-data:/data, companion-signed-in-session:/companion-signed-in:ro]
    depends_on: [redis, companion]

  crunchyroll:
    <<: *backend
    image: ghcr.io/hcx-labs/fanoos-crunchyroll:${FANOOS_VERSION:-latest}
    environment:
      <<: *backend-env
      CRUNCHYROLL_BASIC_AUTH: ${CRUNCHYROLL_BASIC_AUTH:-}
      CRUNCHYROLL_APP_VERSION: ${CRUNCHYROLL_APP_VERSION:-}
    volumes: [crunchyroll-data:/data]

  plex:
    <<: *backend
    image: ghcr.io/hcx-labs/fanoos-plex:${FANOOS_VERSION:-latest}
    environment:
      <<: *backend-env
      PLEX_OWNED_ONLY: ${PLEX_OWNED_ONLY:-0}
    volumes: [plex-data:/data]

  # Generates YouTube's anti-bot tokens and streams media for the YouTube backend.
  companion:
    image: quay.io/invidious/invidious-companion:latest
    restart: unless-stopped
    environment:
      SERVER_SECRET_KEY: ${COMPANION_SECRET:?set COMPANION_SECRET (16 characters) in .env}
      HOST: 0.0.0.0
      PORT: "8282"
      # Optional: send YouTube traffic through an HTTP proxy.
      PROXY: ${COMPANION_PROXY:-}

  # Optional: a signed-in companion, used only for age-restricted videos. Start it with
  #   docker compose --profile age-restricted up -d companion-signed-in
  # then sign in with the code shown in Settings → Signed-in playback (also in its log). Use a
  # secondary Google account. This companion is patched to keep the sign-in across restarts
  # (docker/companion-signed-in.Dockerfile), in the companion-signed-in-session volume.
  companion-signed-in:
    image: ghcr.io/hcx-labs/fanoos-companion-signed-in:${FANOOS_VERSION:-latest}
    profiles: [age-restricted]
    restart: unless-stopped
    environment:
      SERVER_SECRET_KEY: ${COMPANION_SECRET:?set COMPANION_SECRET (16 characters) in .env}
      PROXY: ${COMPANION_PROXY:-}
    volumes: [companion-signed-in-session:/var/tmp/youtubei.js]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]

volumes:
  companion-signed-in-session:
  core-data:
  youtube-data:
  crunchyroll-data:
  plex-data:
