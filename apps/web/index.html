<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Fanoos</title>
    <script>
      // Session cookies, passkeys and the server's origin check are bound to "localhost";
      // the same app opened on a loopback IP would look like another site.
      if (location.hostname === "127.0.0.1" || location.hostname === "[::1]") {
        location.replace(location.href.replace(location.hostname, "localhost"));
      }
      try {
        var t = localStorage.getItem("tube.theme") || "dark";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
