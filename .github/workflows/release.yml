# Cut a release by hand: Actions → Release → Run workflow, then pick patch, minor or major.
# Bumps the version in every package.json, commits and tags it, builds and pushes the
# core and backend images for amd64 and arm64 to GitHub Container Registry, then
# publishes a GitHub release with generated notes.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Bump version, commit and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bump version
        id: bump
        run: |
          version=$(node scripts/bump-version.mjs "${{ inputs.bump }}")
          # Keep the lockfile's workspace versions in step.
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        id: commit
        run: |
          version="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$version"
          git tag -a "v$version" -m "v$version"
          git push origin "HEAD:${{ github.ref_name }}" "v$version"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  images:
    name: Image (${{ matrix.image }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [core, youtube, crunchyroll]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fanoos-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=fanoos-${{ matrix.image }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: FANOOS_COMMIT=${{ needs.version.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: Publish release
    needs: [version, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.version.outputs.version }}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "## Images"
            echo
            echo '```'
            for image in core youtube crunchyroll; do echo "ghcr.io/$owner/fanoos-$image:$version"; done
            echo '```'
            echo
            echo 'Platforms: `linux/amd64`, `linux/arm64`. See `compose.yaml` to run the whole stack.'
          } > notes.md
          gh release create "v$version" --title "v$version" --notes-file notes.md --generate-notes --verify-tag
